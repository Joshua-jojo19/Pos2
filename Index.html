<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>POS System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    .status { font-size: 0.85em; color: #666; margin-bottom: 16px; }
    .product { display: flex; justify-content: space-between; align-items: center;
               border: 1px solid #e0e0e0; padding: 12px 14px; margin-bottom: 8px; border-radius: 8px; }
    .product .info { display: flex; flex-direction: column; gap: 2px; }
    .product .name { font-weight: 600; }
    .product .meta { font-size: 0.85em; color: #666; }
    .product button { padding: 8px 16px; cursor: pointer; border: none; border-radius: 6px;
                      background: #2563eb; color: #fff; font-size: 0.95em; }
    .product button:disabled { background: #cbd5e1; cursor: not-allowed; }
    #cart { margin-top: 28px; border-top: 2px solid #333; padding-top: 16px; }
    #cart h2 { margin-top: 0; }
    .cart-item { display: flex; justify-content: space-between; align-items: center;
                 margin-bottom: 8px; gap: 8px; }
    .cart-item .controls { display: flex; align-items: center; gap: 6px; }
    .cart-item button { width: 28px; height: 28px; border: 1px solid #ccc; background: #fff;
                        border-radius: 4px; cursor: pointer; font-size: 1em; line-height: 1; }
    .cart-item .remove { color: #b91c1c; border-color: #fca5a5; }
    #total { font-weight: bold; font-size: 1.2em; margin-top: 12px; }
    #checkout { margin-top: 14px; padding: 12px 24px; font-size: 1em; cursor: pointer;
                border: none; border-radius: 8px; background: #16a34a; color: #fff; width: 100%; }
    #checkout:disabled { background: #cbd5e1; cursor: not-allowed; }
    #message { margin-top: 12px; min-height: 1.2em; }
    .error { color: #b91c1c; }
    .success { color: #15803d; }
    .empty { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <h1>POS</h1>
  <div class="status" id="status">Loading products…</div>
  <div id="products"></div>

  <div id="cart">
    <h2>Cart</h2>
    <div id="cart-items"></div>
    <div id="total">Total: $0.00</div>
    <button id="checkout" disabled>Checkout</button>
    <div id="message"></div>
  </div>

  <script>
    // ✅ YOUR CLOUDFLARE WORKER URL IS HERE
    const API = "https://blue-tooth-f141.josuwa2.workers.dev";

    let cart = [];
    let productsById = {};

    const statusEl  = document.getElementById("status");
    const productsEl = document.getElementById("products");
    const cartEl     = document.getElementById("cart-items");
    const totalEl    = document.getElementById("total");
    const checkoutEl = document.getElementById("checkout");
    const messageEl  = document.getElementById("message");

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = type || "";
    }

    async function loadProducts() {
      statusEl.textContent = "Loading products…";
      productsEl.innerHTML = "";
      try {
        const res = await fetch(API + "/api/products");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const products = await res.json();

        if (!Array.isArray(products) || products.length === 0) {
          statusEl.textContent = "No products in the database yet.";
          return;
        }

        statusEl.textContent = products.length + " product(s) available";
        productsById = {};
        products.forEach(p => {
          productsById[p.id] = p;
          const div = document.createElement("div");
          div.className = "product";

          const info = document.createElement("div");
          info.className = "info";
          info.innerHTML =
            `<span class="name">${p.name}</span>` +
            `<span class="meta">$${Number(p.price).toFixed(2)} · stock: ${p.stock}</span>`;

          const btn = document.createElement("button");
          btn.textContent = "Add";
          btn.disabled = p.stock <= 0;
          btn.onclick = () => addToCart(p);

          div.appendChild(info);
          div.appendChild(btn);
          productsEl.appendChild(div);
        });
      } catch (err) {
        statusEl.textContent = "Failed to load products.";
        showMessage("Error loading products: " + err.message, "error");
      }
    }

    function addToCart(product) {
      const existing = cart.find(i => i.id === product.id);
      if (existing) {
        if (existing.qty >= product.stock) {
          showMessage(`Only ${product.stock} in stock.`, "error");
          return;
        }
        existing.qty++;
      } else {
        cart.push({ id: product.id, name: product.name, price: Number(product.price), qty: 1 });
      }
      showMessage("");
      renderCart();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      const product = productsById[id];
      const newQty = item.qty + delta;

      if (newQty <= 0) {
        cart = cart.filter(i => i.id !== id);
      } else if (product && newQty > product.stock) {
        showMessage(`Only ${product.stock} in stock.`, "error");
        return;
      } else {
        item.qty = newQty;
      }
      renderCart();
    }

    function renderCart() {
      cartEl.innerHTML = "";
      if (cart.length === 0) {
        cartEl.innerHTML = '<div class="empty">Cart is empty.</div>';
        totalEl.textContent = "Total: $0.00";
        checkoutEl.disabled = true;
        return;
      }

      let total = 0;
      cart.forEach(item => {
        total += item.price * item.qty;
        const row = document.createElement("div");
        row.className = "cart-item";

        const label = document.createElement("span");
        label.textContent = `${item.name} — $${(item.price * item.qty).toFixed(2)}`;

        const controls = document.createElement("div");
        controls.className = "controls";

        const minus = document.createElement("button");
        minus.textContent = "−";
        minus.onclick = () => changeQty(item.id, -1);

        const qty = document.createElement("span");
        qty.textContent = "x" + item.qty;

        const plus = document.createElement("button");
        plus.textContent = "+";
        plus.onclick = () => changeQty(item.id, 1);

        const remove = document.createElement("button");
        remove.textContent = "×";
        remove.className = "remove";
        remove.onclick = () => changeQty(item.id, -item.qty);

        controls.append(minus, qty, plus, remove);
        row.append(label, controls);
        cartEl.appendChild(row);
      });

      totalEl.textContent = "Total: $" + total.toFixed(2);
      checkoutEl.disabled = false;
    }

    checkoutEl.onclick = async () => {
      if (cart.length === 0) return;
      checkoutEl.disabled = true;
      showMessage("Processing…");

      try {
        for (const item of cart) {
          const res = await fetch(API + "/api/checkout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ productId: item.id, quantity: item.qty })
          });

          let data = {};
          try { data = await res.json(); } catch (_) {}

          if (!res.ok) {
            throw new Error(data.error || `Checkout failed (HTTP ${res.status})`);
          }
        }

        showMessage("Checkout complete!", "success");
        cart = [];
        renderCart();
        await loadProducts();
      } catch (err) {
        showMessage("Error: " + err.message, "error");
        checkoutEl.disabled = false;
      }
    };

    loadProducts();
  </script>
</body>
</html>
